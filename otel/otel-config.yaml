# OpenTelemetry Collector pipeline (runs inside docker-compose as otel-collector).
# Every signal is fanned out to two sinks:
#   1. Elasticsearch (searched and visualised in Kibana)
#   2. Raw OTLP JSON files in ./data  (read back by com.example.apps.SparkApp)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    mapping:
      mode: otel            # OTel-native data streams: traces-generic.otel-default, logs-..., metrics-...
  file/traces:
    path: /data/spans.json
  file/logs:
    path: /data/logs.json
  file/metrics:
    path: /data/metrics.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch, file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch, file/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch, file/metrics]
