receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  file/traces:
    path: /Users/ereshtayanna/IdeaProjects/OtelSpark/data/spans.json
  file/logs:
    path: /Users/ereshtayanna/IdeaProjects/OtelSpark/data/logs.json
  file/metrics:
    path: /Users/ereshtayanna/IdeaProjects/OtelSpark/data/metrics.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]